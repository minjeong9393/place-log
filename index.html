<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SCMJ 장소</title>
<meta name="description" content="SCMJ 장소 — 부부가 같이 저장하는 가볼 곳 지도. 식당·카페·나들이를 지도에 찍고 가보기 전/가본 곳으로 나눠 별점과 후기를 남깁니다. 광고 없이 기기에 저장됩니다.">
<meta name="theme-color" content="#0f7a6c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SCMJ 장소">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* SCMJ 장소 — 지도 핀 테마. 외부 SDK 없음(지도 타일·Leaflet 만 불러옴), 광고·추적 없음. */
:root{
  color-scheme:light;
  --accent:#0f7a6c;
  --accent-ink:#0a5c51;
  --accent-soft:#e4f3ef;
  --want:#e2603a;
  --want-ink:#a8401f;
  --want-soft:#fdeee8;
  --done:#0f7a6c;
  --done-ink:#0a5c51;
  --done-soft:#e4f3ef;
  --gold:#e39c0f;
  --gold-ink:#8a6408;
  --gold-soft:#fff5dc;
  --bg:#f6f7f6;
  --surface:#ffffff;
  --surface-2:#eef1f0;
  --surface-3:#e2e7e5;
  --line:#e6eae8;
  --line-2:#d5dcd9;
  --text:#14201e;
  --text-2:#5d6b68;
  --text-3:#8b9794;
  --shadow-s:0 1px 2px rgba(12,32,28,.05);
  --shadow-c:0 1px 2px rgba(12,32,28,.05),0 12px 26px -18px rgba(12,32,28,.35);
  --r:16px;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Pretendard Variable","Segoe UI","Helvetica Neue",Arial,"Liberation Sans","DejaVu Sans","Noto Sans KR","Noto Sans",sans-serif;
  --tabh:58px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);background:var(--bg);color:var(--text);
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
body.sheet-open{overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#root{
  display:flex;flex-direction:column;height:100vh;height:100dvh;
  margin:0 auto;background:var(--bg);position:relative;overflow:hidden;
}
@media (min-width:1400px){#root{max-width:1500px;box-shadow:0 0 0 1px var(--line)}}

/* ---------- 상단 바 ---------- */
.appbar{
  flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;position:relative;z-index:30;
}
.brand{display:flex;align-items:center;gap:8px;min-width:0;order:0;flex:1 1 auto}
.brand .logo{width:30px;height:30px;flex:0 0 auto;display:block}
.brand b{display:block;font-size:16px;font-weight:850;letter-spacing:-.02em;line-height:1.15}
.brand small{display:block;margin-top:1px;font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:-.01em}
.searchbox{
  display:flex;align-items:center;gap:6px;order:3;flex:1 1 100%;min-width:0;height:36px;padding:0 11px;
  background:var(--surface-2);border:1px solid transparent;border-radius:11px;
  transition:background .14s,border-color .14s;
}
.searchbox:focus-within{border-color:var(--line-2);background:var(--surface)}
.searchbox svg{width:16px;height:16px;color:var(--text-3);flex:0 0 auto}
.searchbox input{
  flex:1 1 auto;min-width:0;height:100%;border:0;background:transparent;outline:none;
  font-size:15px;font-weight:600;color:var(--text);
}
.searchbox input::placeholder{color:var(--text-3);font-weight:600}
.searchbox .clr{display:none;width:22px;height:22px;border:0;border-radius:50%;background:var(--surface-3);color:var(--text-2);font-size:12px;line-height:1;padding:0}
.searchbox.has .clr{display:block}
.iconbtn{
  order:2;width:36px;height:36px;flex:0 0 auto;display:grid;place-items:center;border:0;border-radius:11px;
  background:transparent;color:var(--text-2);font-size:19px;line-height:1;
}
.iconbtn:active{background:var(--surface-2)}
.addbtn{
  display:none;order:3;align-items:center;gap:4px;height:36px;padding:0 13px;border:0;border-radius:11px;
  background:var(--accent);color:#fff;font-size:13.5px;font-weight:850;letter-spacing:-.02em;
}
.addbtn:active{background:var(--accent-ink)}
.syncpill{
  order:1;display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;height:28px;padding:0 9px;
  border-radius:999px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--text-2);font-size:11px;font-weight:850;letter-spacing:-.02em;white-space:nowrap;
}
.syncpill .d{width:6px;height:6px;border-radius:50%;background:var(--text-3)}
.syncpill[data-status="live"]{color:var(--accent-ink);border-color:rgba(15,122,108,.35);background:var(--accent-soft)}
.syncpill[data-status="live"] .d{background:var(--accent)}
.syncpill[data-status="sync"]{color:var(--gold-ink);border-color:#eccd8c;background:var(--gold-soft)}
.syncpill[data-status="sync"] .d{background:var(--gold)}
.syncpill[data-status="offline"]{color:var(--want-ink);border-color:#f0c3b3;background:var(--want-soft)}
.syncpill[data-status="offline"] .d{background:var(--want)}

/* ---------- 필터 ---------- */
.filterbar{order:4;flex:1 1 100%;display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.tabs{display:flex;gap:2px;background:var(--surface-2);border-radius:11px;padding:3px;flex:0 0 auto}
.tabs button{
  height:29px;padding:0 10px;border:0;border-radius:9px;background:transparent;
  font-size:12.5px;font-weight:850;letter-spacing:-.02em;color:var(--text-2);white-space:nowrap;
}
.tabs button b{font-size:11px;font-weight:800;color:var(--text-3);margin-left:3px;font-variant-numeric:tabular-nums}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(12,32,28,.12)}
.tabs button[aria-selected="true"] b{color:var(--accent-ink)}
.sortsel{
  height:35px;padding:0 6px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);
  color:var(--text-2);font-size:12px;font-weight:800;letter-spacing:-.02em;flex:0 0 auto;
}
.catbar{
  display:flex;gap:5px;overflow-x:auto;flex:1 1 100%;padding-bottom:1px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%);
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%);
}
.catbar::-webkit-scrollbar{display:none}
.cat{
  height:29px;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--text-2);font-size:11.5px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;flex:0 0 auto;
  display:inline-flex;align-items:center;gap:4px;
}
.cat b{font-size:10.5px;font-weight:800;color:var(--text-3);font-variant-numeric:tabular-nums}
.cat[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.cat[aria-pressed="true"] b{color:var(--accent-ink)}

/* ---------- 본문 ---------- */
#view{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
.panes{height:100%;display:block}
.pane-list{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 0 calc(var(--tabh) + 84px)}
.pane-map{position:absolute;left:0;right:0;top:0;bottom:var(--tabh);background:#e8ece9}
/* 지도는 숨김(visibility)으로만 감춘다 — display:none 이면 Leaflet 이 크기 0 으로 계산해 깨진다 */
#view[data-view="list"] .pane-map{visibility:hidden;pointer-events:none}
#view[data-view="map"] .pane-list{display:none}
#map{position:absolute;inset:0}

/* ---------- 목록 ---------- */
.listhead{
  position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:9px 14px 8px;background:rgba(246,247,246,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);font-size:11.5px;font-weight:800;color:var(--text-3);
  letter-spacing:-.01em;
}
.listhead b{color:var(--text-2);font-variant-numeric:tabular-nums}
.listhead .org{margin-left:auto;display:inline-flex;align-items:center;gap:4px;color:var(--text-3);font-weight:750}
.listhead .org button{
  height:22px;padding:0 7px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);
  color:var(--text-2);font-size:10.5px;font-weight:800;
}
.lgroup{margin-top:4px}
.lgh{
  display:flex;align-items:center;gap:6px;padding:11px 14px 5px;
  font-size:11.5px;font-weight:850;color:var(--text-2);letter-spacing:-.02em;
}
.lgh b{font-size:10.5px;font-weight:800;color:var(--text-3);font-variant-numeric:tabular-nums}
.lgh .sw{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.lgh.want .sw{background:var(--want)}
.lgh.done .sw{background:var(--done)}

.pcard{
  display:flex;gap:10px;align-items:flex-start;margin:6px 10px;padding:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-s);transition:border-color .14s,box-shadow .16s,transform .12s;
  position:relative;cursor:pointer;
}
.pcard:hover{border-color:var(--line-2);box-shadow:var(--shadow-c)}
.pcard:active{transform:scale(.996)}
.pcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.thumb{
  width:46px;height:46px;flex:0 0 auto;border-radius:12px;background:var(--soft,var(--surface-2));
  display:grid;place-items:center;font-size:23px;line-height:1;
}
.cbody{flex:1 1 auto;min-width:0;display:block}
.crow{display:flex;align-items:center;gap:6px;min-width:0}
.cname{
  font-size:14.5px;font-weight:850;letter-spacing:-.02em;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
}
.badge{
  flex:0 0 auto;font-size:10px;font-weight:850;letter-spacing:-.02em;padding:2px 6px;border-radius:999px;
}
.badge.want{background:var(--want-soft);color:var(--want-ink)}
.badge.done{background:var(--done-soft);color:var(--done-ink)}
.cdis{
  margin-left:auto;flex:0 0 auto;font-size:11px;font-weight:850;color:var(--text-2);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.cdis.none{color:var(--text-3);font-weight:700}
.cmeta{
  display:block;margin-top:2px;font-size:11.5px;font-weight:700;color:var(--text-3);
  letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cnote{
  display:block;margin-top:5px;font-size:12.5px;font-weight:600;color:var(--text-2);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.cfoot{display:flex;align-items:center;gap:7px;margin-top:6px;flex-wrap:wrap}
.cdate{font-size:10.5px;font-weight:750;color:var(--text-3);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.cmenu{
  font-size:10.5px;font-weight:750;color:var(--gold-ink);background:var(--gold-soft);
  border-radius:999px;padding:2px 7px;letter-spacing:-.02em;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.maplink{
  flex:0 0 auto;height:26px;padding:0 8px;border:1px solid var(--line-2);border-radius:999px;
  background:var(--surface);color:var(--text-2);font-size:10.5px;font-weight:800;
  display:inline-flex;align-items:center;gap:3px;
}
.maplink:hover{background:var(--surface-2)}

/* 별 표시 */
.stars{position:relative;display:inline-block;font-size:11.5px;line-height:1;letter-spacing:1px;color:#dfe4e2;flex:0 0 auto}
.stars .on{position:absolute;left:0;top:0;white-space:nowrap;overflow:hidden;color:var(--gold);width:calc(var(--v,0) / 5 * 100%)}
.stars.none{color:var(--surface-3)}
.stars.none .on{display:none}

/* 빈 화면 */
.empty{padding:38px 24px;text-align:center;color:var(--text-3)}
.empty .big{font-size:40px;line-height:1}
.empty h3{margin:10px 0 4px;font-size:15px;font-weight:850;color:var(--text-2);letter-spacing:-.02em}
.empty p{margin:0;font-size:12.5px;font-weight:600;line-height:1.5}
.empty .btn{margin-top:14px}

/* ---------- 지도 ---------- */
#map .leaflet-container{font-family:var(--font)}
.leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 12px 30px -14px rgba(12,32,28,.5);padding:2px}
.leaflet-popup-content{margin:10px 12px;width:212px !important;font-family:var(--font)}
.pop .phead{display:flex;gap:8px;align-items:flex-start}
.pop .pthumb{width:32px;height:32px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;font-size:17px;background:var(--soft,var(--surface-2))}
.pop b{display:block;font-size:13.5px;font-weight:850;letter-spacing:-.02em;line-height:1.3;color:var(--text)}
.pop small{display:block;margin-top:2px;font-size:11px;font-weight:750;color:var(--text-3);letter-spacing:-.01em}
.pop .pstars{margin-top:7px;display:flex;align-items:center;gap:6px}
.pop .pnote{margin:6px 0 0;font-size:12px;line-height:1.45;color:var(--text-2);font-weight:600;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pop .pacts{display:flex;gap:5px;margin-top:9px}
.pop .pacts button,.pop .pacts a{
  flex:1 1 0;height:28px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--text-2);font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;
  text-decoration:none;letter-spacing:-.02em;padding:0 4px;
}
.pop .pacts button.pri{background:var(--accent);border-color:var(--accent);color:#fff}

.maplegend{
  position:absolute;left:10px;top:78px;z-index:500;display:flex;gap:9px;align-items:center;
  background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:999px;
  padding:5px 10px;font-size:10.5px;font-weight:800;color:var(--text-2);letter-spacing:-.02em;
  box-shadow:var(--shadow-s);backdrop-filter:blur(4px);
}
.maplegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.maplegend .w i{background:var(--want)}
.maplegend .d i{background:var(--done)}
.mapctrls{position:absolute;right:10px;top:10px;z-index:500;display:flex;flex-direction:column;gap:6px}
.mapctrls button{
  height:32px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.96);
  color:var(--text-2);font-size:11.5px;font-weight:800;letter-spacing:-.02em;
  box-shadow:var(--shadow-s);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
}
.mapctrls button:active{background:var(--surface-2)}
.pickhint{
  position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:600;
  display:flex;align-items:center;gap:8px;background:#14201e;color:#fff;border-radius:999px;
  padding:7px 8px 7px 14px;font-size:11.5px;font-weight:800;letter-spacing:-.02em;
  box-shadow:0 8px 22px -10px rgba(0,0,0,.55);max-width:92%;
}
.pickhint button{height:24px;padding:0 9px;border:0;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font-size:11px;font-weight:800}
.pickhint[hidden]{display:none}
.mapfail{
  position:absolute;inset:auto 10px 10px 10px;z-index:500;background:var(--want-soft);border:1px solid #f0c3b3;
  color:var(--want-ink);border-radius:12px;padding:10px 12px;font-size:12px;font-weight:700;line-height:1.45;
}
.mapfail[hidden]{display:none}
/* 지도 핀 */
.pinwrap{background:none;border:0}
.pin{
  width:32px;height:32px;border-radius:50% 50% 50% 5px;transform:rotate(-45deg);
  background:var(--c,var(--want));border:2.5px solid #fff;
  box-shadow:0 3px 9px rgba(10,26,22,.35);
  display:grid;place-items:center;
}
.pin i{transform:rotate(45deg);font-style:normal;font-size:14px;line-height:1;filter:saturate(.95)}
.pinwrap.sel .pin{box-shadow:0 0 0 3px rgba(15,122,108,.25),0 4px 12px rgba(10,26,22,.45);transform:rotate(-45deg) scale(1.12)}
.pinwrap.temp .pin{background:#2563eb}
.originbadge{
  width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;
  box-shadow:0 0 0 2px rgba(37,99,235,.25),0 2px 6px rgba(0,0,0,.3);
}
.pinlabel{
  background:rgba(255,255,255,.92);border:1px solid var(--line-2);border-radius:6px;padding:1px 5px;
  font-size:10px;font-weight:800;color:var(--text-2);box-shadow:none;
}
.pinlabel::before{display:none}

/* ---------- 하단 탭바 · FAB ---------- */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;z-index:620;height:calc(var(--tabh) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;background:rgba(255,255,255,.97);border-top:1px solid var(--line);backdrop-filter:blur(8px);
}
.tabbar button{
  flex:1 1 0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-size:10.5px;font-weight:850;letter-spacing:-.02em;color:var(--text-3);
}
.tabbar button .ico{font-size:18px;line-height:1}
.tabbar button[aria-selected="true"]{color:var(--accent-ink)}
.fab{
  position:absolute;right:14px;bottom:calc(var(--tabh) + 14px + env(safe-area-inset-bottom));z-index:630;
  width:52px;height:52px;border:0;border-radius:50%;background:var(--accent);color:#fff;
  font-size:26px;font-weight:400;line-height:1;box-shadow:0 10px 24px -8px rgba(15,122,108,.7);
  display:grid;place-items:center;
}
.fab:active{background:var(--accent-ink)}

/* ---------- 시트 ---------- */
#sheetroot{position:fixed;inset:0;z-index:1000;pointer-events:none}
#sheetroot .overlay{position:absolute;inset:0;background:rgba(10,22,19,.42);pointer-events:auto;animation:fade .16s ease}
.sheet{
  position:absolute;left:0;right:0;bottom:0;pointer-events:auto;
  background:var(--surface);border-radius:20px 20px 0 0;
  max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -14px 40px -16px rgba(10,22,19,.4);
  animation:up .2s cubic-bezier(.22,.8,.24,1);
}
@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet .grab{width:38px;height:4px;border-radius:999px;background:var(--surface-3);margin:8px auto 0;flex:0 0 auto}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 16px 6px;flex:0 0 auto}
.sheet-head h2{margin:0;font-size:16px;font-weight:850;letter-spacing:-.02em}
.sheet-head .xbtn{
  margin-left:auto;width:30px;height:30px;border:0;border-radius:50%;background:var(--surface-2);
  color:var(--text-2);font-size:14px;line-height:1;display:grid;place-items:center;
}
.sheet-body{padding:2px 16px 12px;overflow-y:auto;flex:1 1 auto;-webkit-overflow-scrolling:touch}
.sheet-foot{
  display:flex;align-items:center;gap:8px;padding:10px 16px 14px;flex:0 0 auto;
  border-top:1px solid var(--line);background:var(--surface);
}
.sheet-foot .grow{flex:1 1 auto}
.flabel{display:block;margin:14px 0 6px;font-size:11.5px;font-weight:850;color:var(--text-2);letter-spacing:-.01em}
.flabel:first-child{margin-top:6px}
.flabel .req{color:var(--want)}
.flabel .opt{font-weight:700;color:var(--text-3)}
.field{
  width:100%;height:42px;padding:0 12px;border:1px solid var(--line-2);border-radius:11px;
  background:var(--surface);font-size:15px;font-weight:600;color:var(--text);outline:none;
  transition:border-color .14s,box-shadow .14s;
}
textarea.field{height:auto;padding:10px 12px;line-height:1.5;resize:vertical;min-height:56px}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field::placeholder{color:var(--text-3);font-weight:600}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row2 .field{flex:1 1 130px;width:auto;min-width:0}
.chipbar{display:flex;gap:5px;flex-wrap:wrap}
.chipsel{
  height:34px;padding:0 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--text-2);font-size:12.5px;font-weight:800;letter-spacing:-.02em;
  display:inline-flex;align-items:center;gap:5px;
}
.chipsel[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:flex;gap:3px;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{
  flex:1 1 0;height:36px;border:0;border-radius:9px;background:transparent;
  font-size:13px;font-weight:850;letter-spacing:-.02em;color:var(--text-2);
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(12,32,28,.14)}
.seg button[data-st="want"][aria-pressed="true"]{color:var(--want-ink)}
.seg button[data-st="done"][aria-pressed="true"]{color:var(--done-ink)}
.searchrow2{display:flex;gap:6px}
.searchrow2 .field{flex:1 1 auto;min-width:0}
.searchrow2 .btn{flex:0 0 auto;white-space:nowrap;padding:0 13px}
.results{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.results button{
  text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);
  font-size:12.5px;font-weight:700;color:var(--text-2);line-height:1.35;
}
.results button:hover{background:var(--surface-2);border-color:var(--line-2)}
.results .none{padding:8px 2px;font-size:12px;font-weight:700;color:var(--text-3)}
.coordrow{
  display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;
  background:var(--surface-2);border-radius:10px;font-size:11.5px;font-weight:750;color:var(--text-2);
  font-variant-numeric:tabular-nums;flex-wrap:wrap;
}
.coordrow .sp{flex:1 1 auto;min-width:0}
.coordrow .none{color:var(--text-3)}
.linksrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btn{
  height:40px;padding:0 14px;border:1px solid var(--line-2);border-radius:11px;background:var(--surface);
  color:var(--text-2);font-size:13.5px;font-weight:850;letter-spacing:-.02em;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;text-decoration:none;
}
.btn.sm{height:30px;padding:0 9px;font-size:11.5px;border-radius:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:active{background:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:#b3261e;border-color:#f0c7c3}
.btn.danger:hover{background:#fdf1f0}
.btn[hidden]{display:none}

/* 별점 입력 */
.starpick{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.starpick .sp{position:relative;width:26px;height:26px;display:block}
.starpick .sp i{position:absolute;inset:0;font-style:normal;font-size:24px;line-height:26px;text-align:center;color:#e2e7e5}
.starpick .sp .fill{position:absolute;left:0;top:0;height:26px;overflow:hidden;width:var(--f,0%)}
.starpick .sp .fill i{color:var(--gold)}
.starpick .sp button{position:absolute;top:0;height:100%;width:50%;border:0;background:transparent;padding:0}
.starpick .sp .h1{left:0}
.starpick .sp .h2{right:0}
.starpick .val{font-size:12.5px;font-weight:850;color:var(--gold-ink);font-variant-numeric:tabular-nums;min-width:24px}
.starpick .clr{height:26px;padding:0 7px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);font-size:10.5px;font-weight:800;color:var(--text-3)}

/* 메뉴 시트 */
.menulist{display:flex;flex-direction:column;gap:2px;margin:4px 0 6px}
.menulist button{
  display:flex;align-items:center;gap:10px;width:100%;padding:12px 10px;border:0;border-radius:11px;
  background:transparent;text-align:left;
}
.menulist button:hover{background:var(--surface-2)}
.menulist button .em{font-size:17px;line-height:1;flex:0 0 auto}
.menulist button .tx{flex:1 1 auto;min-width:0}
.menulist button .tx b{display:block;font-size:13.5px;font-weight:800;letter-spacing:-.02em;color:var(--text)}
.menulist button .tx small{display:block;margin-top:1px;font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:-.01em}
.menulist button .go{color:var(--text-3);font-size:15px}
.hint{margin:4px 0 10px;font-size:12px;font-weight:650;color:var(--text-3);line-height:1.5}
.roombox{
  display:flex;align-items:center;gap:8px;padding:11px 12px;border:1px dashed var(--line-2);border-radius:12px;
  background:var(--surface-2);font-size:14px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;
}
.roombox .sp{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.syncstate{
  display:flex;align-items:center;gap:7px;padding:9px 11px;border-radius:10px;background:var(--accent-soft);
  color:var(--accent-ink);font-size:12px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px;
}
.syncstate .d{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.syncstate[data-status="off"]{background:var(--surface-2);color:var(--text-2)}
.syncstate[data-status="off"] .d{background:var(--text-3)}
.syncstate[data-status="offline"]{background:var(--want-soft);color:var(--want-ink)}
.syncstate[data-status="offline"] .d{background:var(--want)}
.syncstate[data-status="sync"]{background:var(--gold-soft);color:var(--gold-ink)}
.syncstate[data-status="sync"] .d{background:var(--gold)}

/* 토스트 */
#toast{
  position:fixed;left:50%;bottom:calc(var(--tabh) + 24px);transform:translate(-50%,14px);
  z-index:1200;background:#14201e;color:#fff;border-radius:999px;padding:9px 16px;
  font-size:12.5px;font-weight:750;letter-spacing:-.01em;box-shadow:0 10px 26px -10px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- PC ---------- */
@media (min-width:900px){
  :root{--tabh:0px}
  .appbar{padding:10px 18px 9px;gap:8px 12px}
  .brand .logo{width:32px;height:32px}
  .brand b{font-size:17px}
  .brand{flex:0 0 auto}
  .searchbox{order:2;flex:1 1 220px;max-width:340px;height:38px}
  .appbar .addbtn{order:3;display:inline-flex;height:38px}
  .syncpill{order:4;margin-left:auto;height:30px}
  .appbar .iconbtn{order:5;width:38px;height:38px}
  .filterbar{order:6;flex:1 1 100%;gap:8px;margin-top:2px}
  .catbar{flex:0 1 auto;overflow:visible;flex-wrap:wrap;padding-bottom:0;-webkit-mask-image:none;mask-image:none}
  .panes{display:grid;grid-template-columns:388px minmax(0,1fr);height:100%}
  .pane-list{height:100%;overflow-y:auto;border-right:1px solid var(--line);padding-bottom:24px}
  .pane-map{position:relative;left:auto;right:auto;top:auto;bottom:auto;height:100%;visibility:visible !important;pointer-events:auto !important}
  #view[data-view="map"] .pane-list{display:block}
  #view[data-view="list"] .pane-map{display:block}
  .tabbar{display:none}
  .fab{display:none}
  .listhead{top:0}
  .pcard{padding:11px 12px;margin:6px 12px}
  .mapctrls{right:14px;top:14px}
  .maplegend{left:14px;top:80px}
  .sheet{
    left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);
    width:min(600px,92vw);max-height:86vh;border-radius:20px;
    animation:pop .18s cubic-bezier(.22,.8,.24,1);
  }
  @keyframes pop{from{transform:translate(-50%,-48%);opacity:.5}to{transform:translate(-50%,-50%);opacity:1}}
  .sheet .grab{display:none}
  .sheet-head{padding:16px 20px 6px}
  .sheet-body{padding:2px 20px 14px}
  .sheet-foot{padding:12px 20px 14px;border-radius:0 0 20px 20px}
  #toast{bottom:30px}
}
@media (min-width:1200px){
  .panes{grid-template-columns:420px minmax(0,1fr)}
}
</style>
</head>
<body>
<div id="root">
  <header class="appbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="#0f7a6c"></rect>
        <path d="M32 12c-8.3 0-15 6.5-15 14.5C17 36.4 32 52 32 52s15-15.6 15-25.5C47 18.5 40.3 12 32 12z" fill="#ffffff"></path>
        <circle cx="32" cy="26.5" r="5.4" fill="#0f7a6c"></circle>
      </svg>
      <div>
        <b>SCMJ 장소</b>
        <small id="brandSub">부부가 같이 채우는 지도</small>
      </div>
    </div>
    <label class="searchbox" id="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4.2-4.2"></path></svg>
      <input id="q" type="search" placeholder="장소·주소·후기 검색" autocomplete="off" enterkeyhint="search" aria-label="장소 검색">
      <button class="clr" id="qClr" type="button" aria-label="검색 지우기">✕</button>
    </label>
    <button class="addbtn" id="btnAddTop" type="button">＋ 추가</button>
    <button class="syncpill" id="syncpill" type="button" data-status="off" aria-label="남편 연동 상태"><span class="d"></span><span class="lbl2">혼자</span></button>
    <button class="iconbtn" id="btnMenu" type="button" aria-label="더보기">⋮</button>
    <div class="filterbar">
      <div class="tabs" id="statusTabs" role="tablist" aria-label="상태 필터"></div>
      <select class="sortsel" id="sortSel" aria-label="정렬">
        <option value="dist">거리순</option>
        <option value="recent">최근 담은순</option>
        <option value="rating">별점순</option>
        <option value="name">이름순</option>
      </select>
      <div class="catbar" id="catbar" role="group" aria-label="카테고리 필터"></div>
    </div>
  </header>

  <main id="view" data-view="list">
    <section class="panes">
      <div class="pane-list" id="paneList">
        <div class="listhead" id="listHead"></div>
        <div id="list"></div>
      </div>
      <div class="pane-map" id="paneMap">
        <div id="map"></div>
        <div class="mapctrls">
          <button type="button" id="btnLocate">📍 내 위치</button>
          <button type="button" id="btnBase">🎯 기준점</button>
        </div>
        <div class="maplegend"><span class="w"><i></i>가보기 전</span><span class="d"><i></i>가본 곳</span></div>
        <div class="pickhint" id="pickHint" hidden><span id="pickMsg">지도를 눌러 위치를 정하세요</span><button type="button" id="btnPickCancel">취소</button></div>
        <div class="mapfail" id="mapFail" hidden>지도를 불러오지 못했어요. 인터넷 연결을 확인해 주세요. 목록·저장은 그대로 쓸 수 있어요.</div>
      </div>
    </section>
    <nav class="tabbar" role="tablist" aria-label="보기 전환">
      <button type="button" data-view="list" role="tab" aria-selected="true"><span class="ico">☰</span>목록</button>
      <button type="button" data-view="map" role="tab" aria-selected="false"><span class="ico">🗺️</span>지도</button>
    </nav>
    <button class="fab" id="fab" type="button" aria-label="장소 추가">＋</button>
  </main>
</div>
<div id="sheetroot"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
/* ------------------------------------------------------------------ *
 *  xlsx.js — 진짜 .xlsx(Office Open XML) 통합 문서를 만드는 최소 구현

 *  cell = null | 숫자 | 문자열 | { v: 값, s: 스타일번호 }

var XL_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
var XL_CRC = null;
function xlCrcTable() {
  if (XL_CRC) return XL_CRC;
  var t = new Array(256);
  for (var n = 0; n < 256; n++) {
    var c = n;
    for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  XL_CRC = t;
  return t;
}
function xlCrc32(bytes) {
  var t = xlCrcTable();
  var c = 0xFFFFFFFF;
  for (var i = 0; i < bytes.length; i++) c = t[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function xlUtf8(str) {
  var s = String(str);
  var out = [];
  for (var i = 0; i < s.length; i++) {
    var c = s.charCodeAt(i);
    if (c < 0x80) out.push(c);
    else if (c < 0x800) out.push(0xC0 | (c >> 6), 0x80 | (c & 63));
    else if (c >= 0xD800 && c <= 0xDBFF && i + 1 < s.length) {
      var c2 = s.charCodeAt(i + 1);
      var cp = 0x10000 + ((c - 0xD800) << 10) + (c2 - 0xDC00);
      out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));

    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true);
    dv.setUint16(12, 0x21, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, name.length, true);
    dv.setUint16(28, 0, true);
    lh.set(name, 30);

    var ce = new Uint8Array(46 + name.length);
    var dv2 = new DataView(ce.buffer);
    dv2.setUint32(0, 0x02014B50, true);
    dv2.setUint16(4, 20, true);
    dv2.setUint16(6, 20, true);
    dv2.setUint16(8, 0x0800, true);
    dv2.setUint16(10, 0, true);
    dv2.setUint16(12, 0, true);
    dv2.setUint16(14, 0x21, true);
    dv2.setUint32(16, crc, true);
    dv2.setUint32(20, data.length, true);
    dv2.setUint32(24, data.length, true);
    dv2.setUint16(28, name.length, true);
    dv2.setUint16(30, 0, true);
    dv2.setUint16(32, 0, true);
    dv2.setUint16(34, 0, true);
    dv2.setUint16(36, 0, true);
    dv2.setUint32(38, 0, true);
    dv2.setUint32(42, offset, true);
    ce.set(name, 46);

    parts.push(lh, data);
    central.push(ce);
    offset += lh.length + data.length;
  });

  var cdSize = central.reduce(function (a, c) { return a + c.length; }, 0);
  var end = new Uint8Array(22);
  var dve = new DataView(end.buffer);
  dve.setUint32(0, 0x06054B50, true);
  dve.setUint16(4, 0, true);
  dve.setUint16(6, 0, true);
  dve.setUint16(8, files.length, true);
  dve.setUint16(10, files.length, true);
  dve.setUint32(12, cdSize, true);
  dve.setUint32(16, offset, true);
  dve.setUint16(20, 0, true);

  var total = offset + cdSize + end.length;
  var out = new Uint8Array(total);
  var p = 0;
  parts.forEach(function (b) { out.set(b, p); p += b.length; });
  central.forEach(function (b) { out.set(b, p); p += b.length; });
  out.set(end, p);
  return out;

function xlEsc(s) {

    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')

}
function xlCol(n) {
  var s = '';

    var m = (n - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    n = Math.floor((n - 1) / 26);

  return s;
}
function xlCellXml(cell, ref) {
  if (cell === null || cell === undefined || cell === '') return '';
  var style = 0;
  var v = cell;
  if (typeof cell === 'object') { style = cell.s || 0; v = cell.v; }
  if (v === null || v === undefined || v === '') return '';
  if (typeof v === 'number' && isFinite(v)) {
    return '<c r="' + ref + '" s="' + style + '"><v>' + v + '</v></c>';
  }
  var txt = String(v);
  if (!txt) return '';
  return '<c r="' + ref + '" s="' + style + '" t="inlineStr"><is><t xml:space="preserve">' + xlEsc(txt) + '</t></is></c>';
}
function xlSheetName(name, used) {
  var base = String(name || 'Sheet').replace(/[\[\]:*?\/\\]/g, ' ').trim().slice(0, 31) || 'Sheet';
  var out = base, i = 2;
  while (used[out]) { out = (base.slice(0, 28) + ' ' + i).slice(0, 31); i++; }
  used[out] = 1;
  return out;
}
function xlSheetXml(sheet) {
  var rows = sheet.rows || [];
  var maxCol = 1;
  rows.forEach(function (r) { var n = (r && r.length) || 0; if (n > maxCol) maxCol = n; });
  var cols = '';
  if (sheet.cols && sheet.cols.length) {
    cols = '<cols>' + sheet.cols.map(function (w, i) {
      return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>';
    }).join('') + '</cols>';
  }
  var body = rows.map(function (row, ri) {
    var r = ri + 1;
    var cells = Array.prototype.map.call(row || [], function (c, ci) { return xlCellXml(c, xlCol(ci + 1) + r); }).join('');
    return '<row r="' + r + '">' + cells + '</row>';
  }).join('');
  var view = '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>';
  var fRows = sheet.filter === true ? rows.length : 0;
  var filter = fRows > 1 ? '<autoFilter ref="A1:' + xlCol(maxCol) + fRows + '"/>' : '';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
    '<dimension ref="A1:' + xlCol(maxCol) + Math.max(1, rows.length) + '"/>' +
    view +
    '<sheetFormatPr defaultRowHeight="16"/>' +
    cols +
    '<sheetData>' + body + '</sheetData>' +
    filter +
    '<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>' +
    '</worksheet>';
}
var XL_STYLES_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
  '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
  '<numFmts count="2">' +
  '<numFmt numFmtId="164" formatCode="#,##0"/>' +
  '<numFmt numFmtId="166" formatCode="#,##0.0"/>' +
  '</numFmts>' +
  '<fonts count="5">' +
  '<font><sz val="10"/><name val="맑은 고딕"/><family val="2"/></font>' +
  '<font><b/><sz val="10"/><color rgb="FFFFFFFF"/><name val="맑은 고딕"/><family val="2"/></font>' +
  '<font><b/><sz val="10"/><name val="맑은 고딕"/><family val="2"/></font>' +
  '<font><sz val="9"/><color rgb="FF6B7280"/><name val="맑은 고딕"/><family val="2"/></font>' +
  '<font><b/><sz val="13"/><color rgb="FF0F4F45"/><name val="맑은 고딕"/><family val="2"/></font>' +
  '</fonts>' +
  '<fills count="4">' +

/* ---------------- 공통 도우미 ---------------- */
function el(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}
function pad2(n) { return String(n).padStart(2, '0'); }
function todayKey() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function uid() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
function num(v) { var n = Number(v); return isFinite(n) ? n : null; }
function isDateKey(k) { return /^\d{4}-\d{2}-\d{2}$/.test(String(k || '')); }
function fmtDateDot(k) {
  if (!isDateKey(k)) return '';
  var p = k.split('-');
  return Number(p[0]) + '.' + p[1] + '.' + p[2];
}
function fmtDateShort(k) {
  if (!isDateKey(k)) return '';

  return Number(p[1]) + '.' + p[2];
}
function fmtDist(m) {
  if (m == null || !isFinite(m)) return '';
  if (m < 1000) return Math.round(m) + 'm';
  return (m / 1000).toFixed(m < 10000 ? 1 : 0) + 'km';
}
function normRating(v) {
  var n = Number(v);
  if (!isFinite(n) || n <= 0) return 0;
  return clamp(Math.round(n * 2) / 2, 0, 5);
}
function catOf(k) { return CATMAP[k] || CATMAP.etc; }
function statusName(st) { return st === 'done' ? '가본 곳' : '가보기 전'; }
function toast(msg) {

function lsGet(k) { try { return window.localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function lsSet(k, v) {

    else window.localStorage.setItem(k, v);

/* ---------------- 상태 저장 ---------------- */
function normPlace(raw) {
  if (!raw || typeof raw !== 'object') return null;
  var name = String(raw.name == null ? '' : raw.name).trim();
  if (!name) return null;
  var cat = CATMAP[raw.cat] ? raw.cat : 'etc';
  var status = raw.status === 'done' ? 'done' : 'want';
  var lat = num(raw.lat), lng = num(raw.lng);
  if (lat != null && (lat < -90 || lat > 90)) lat = null;
  if (lng != null && (lng < -180 || lng > 180)) lng = null;
  return {
    id: String(raw.id || uid()),
    name: name.slice(0, 80),
    cat: cat,
    status: status,
    lat: lat,
    lng: lng,
    addr: String(raw.addr == null ? '' : raw.addr).slice(0, 200),
    menu: String(raw.menu == null ? '' : raw.menu).slice(0, 160),
    memo: String(raw.memo == null ? '' : raw.memo).slice(0, 1200),
    review: String(raw.review == null ? '' : raw.review).slice(0, 1200),
    rating: normRating(raw.rating),
    visitedAt: isDateKey(raw.visitedAt) ? raw.visitedAt : '',
    createdAt: Number(raw.createdAt) || Date.now(),
    updatedAt: Number(raw.updatedAt) || Date.now()
  };
}
function normRemoved(raw) {
  var out = {};
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
  Object.keys(raw).forEach(function (id) {
    var ts = Number(raw[id]);
    if (isFinite(ts) && ts > 0) out[id] = ts;
  });
  return out;
}
function loadState() {
  var raw = lsGet(KEY_STATE);
  if (raw) {
    try {
      var o = JSON.parse(raw);
      if (o && typeof o === 'object') {
        state.places = (Array.isArray(o.places) ? o.places : []).map(normPlace).filter(Boolean);
        state.removed = normRemoved(o.removed);
        state.updatedAt = Number(o.updatedAt) || 0;
        return;
      }
    } catch (e) { }
  }
  state.places = SEED.map(normPlace).filter(Boolean);
  state.removed = {};
}
function persist() {
  state.updatedAt = Date.now();
  var ok = lsSet(KEY_STATE, JSON.stringify({ v: 1, places: state.places, removed: state.removed, updatedAt: state.updatedAt }));
  if (!ok) toast('이 기기 저장 공간이 부족해 저장하지 못했어요');
  return ok;
}
function loadPrefs() {

    var o = JSON.parse(lsGet(KEY_PREFS) || '{}');

      if (['all', 'want', 'done'].indexOf(o.status) >= 0) prefs.status = o.status;
      if (o.cat === 'all' || CATMAP[o.cat]) prefs.cat = o.cat;
      if (['dist', 'recent', 'rating', 'name'].indexOf(o.sort) >= 0) prefs.sort = o.sort;
      if (['list', 'map'].indexOf(o.view) >= 0) prefs.view = o.view;
    }
  } catch (e) { }
}
function savePrefs() { lsSet(KEY_PREFS, JSON.stringify(prefs)); }
function loadOrigin() {
  try {
    var o = JSON.parse(lsGet(KEY_ORIGIN) || '{}');
    var lat = num(o.lat), lng = num(o.lng);
    if (lat != null && lng != null && isFinite(lat) && isFinite(lng)) {
      origin = { lat: lat, lng: lng, label: String(o.label || '기준점'), kind: String(o.kind || 'custom'), at: Number(o.at) || 0 };
    }

}

/* ---------------- 거리 ---------------- */
function distM(lat1, lng1, lat2, lng2) {
  var R = 6371000;
  var toRad = Math.PI / 180;
  var dLat = (lat2 - lat1) * toRad;
  var dLng = (lng2 - lng1) * toRad;
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}
function placeDist(p) {
  if (p.lat == null || p.lng == null) return null;
  return distM(origin.lat, origin.lng, p.lat, p.lng);
}

/* ---------------- 목록·필터 ---------------- */
function matchesQuery(p, q) {
  if (!q) return true;
  var s = (p.name + ' ' + p.addr + ' ' + p.memo + ' ' + p.review + ' ' + p.menu + ' ' + catOf(p.cat).name).toLowerCase();
  return s.indexOf(q.toLowerCase()) >= 0;
}
function filtered() {
  var q = (el('q') && el('q').value || '').trim();
  var list = state.places.filter(function (p) {
    if (prefs.status !== 'all' && p.status !== prefs.status) return false;
    if (prefs.cat !== 'all' && p.cat !== prefs.cat) return false;
    return matchesQuery(p, q);
  });
  var byDist = function (a, b) {
    var da = placeDist(a), db = placeDist(b);
    if (da == null && db == null) return a.name.localeCompare(b.name, 'ko');
    if (da == null) return 1;
    if (db == null) return -1;
    return da - db;
  };
  list.sort(function (a, b) {
    if (prefs.sort === 'recent') return (b.createdAt || 0) - (a.createdAt || 0);
    if (prefs.sort === 'rating') {
      if ((b.rating || 0) !== (a.rating || 0)) return (b.rating || 0) - (a.rating || 0);
      return byDist(a, b);
    }
    if (prefs.sort === 'name') return a.name.localeCompare(b.name, 'ko');
    return byDist(a, b);
  });
  return list;
}
function counts() {
  var c = { all: state.places.length, want: 0, done: 0, cats: {} };
  CATS.forEach(function (k) { c.cats[k.key] = 0; });
  state.places.forEach(function (p) {
    c[p.status] = (c[p.status] || 0) + 1;
    c.cats[p.cat] = (c.cats[p.cat] || 0) + 1;
  });
  return c;
}
function avgRating(list) {
  var rated = list.filter(function (p) { return p.rating > 0; });
  if (!rated.length) return 0;
  return Math.round((rated.reduce(function (a, p) { return a + p.rating; }, 0) / rated.length) * 10) / 10;
}

function pinIcon(p, cls) {

function locate(silent) {

  if (!silent) toast('내 위치를 찾는 중…');
  navigator.geolocation.getCurrentPosition(function (pos) {
    setOrigin(pos.coords.latitude, pos.coords.longitude, '내 위치', 'gps');
    if (map && mapReady) map.flyTo([origin.lat, origin.lng], Math.max(map.getZoom(), 13), { duration: .5 });
    if (!silent) toast('내 위치를 기준으로 거리를 계산했어요');
  }, function (err) {
    if (!silent) toast('위치를 받지 못했어요 — 지도의 기준점을 직접 정할 수 있어요');

function upsert(p) {
  var found = false;
  state.places = state.places.map(function (x) { return x.id === p.id ? (found = true, p) : x; });
  if (!found) state.places.push(p);
  if (state.removed[p.id]) delete state.removed[p.id];
  persist();
}
function removePlace(id) {
  if (!id) return;
  state.places = state.places.filter(function (p) { return p.id !== id; });
  state.removed[id] = Date.now();
  if (ui.sel === id) ui.sel = '';
  persist();
  closeSheet();
  render();
  toast('목록에서 지웠어요');
  syncDelPlace(id);
}

/* ---------------- 주소 검색 (Nominatim) ---------------- */
var formLat = null, formLng = null, pendingDraft = null;
function doSearch() {
  var q = (el('fAddr') && el('fAddr').value || '').trim();
  var box = el('searchResults');
  if (!q) { box.innerHTML = '<div class="none">주소나 장소 이름을 넣어 주세요</div>'; return; }
  box.innerHTML = '<div class="none">찾는 중…</div>';
  var url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=ko&q=' + encodeURIComponent(q);
  fetch(url, { headers: { 'Accept': 'application/json' } }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (rows) {
    if (!Array.isArray(rows) || !rows.length) {
      box.innerHTML = '<div class="none">검색 결과가 없어요 — 지도에서 직접 찍어 주세요</div>';
      return;
    }
    box.innerHTML = rows.map(function (r, i) {
      return '<button type="button" data-i="' + i + '">' + esc(r.display_name || r.name || '이름 없음') + '</button>';
    }).join('');
    box.querySelectorAll('button[data-i]').forEach(function (b) {
      b.addEventListener('click', function () {
        var r = rows[Number(b.getAttribute('data-i'))];
        var lat = Number(r.lat), lng = Number(r.lon);
        formLat = lat; formLng = lng;
        if (el('fCoord')) el('fCoord').innerHTML = coordText(lat, lng);
        if (el('fAddr')) el('fAddr').value = r.display_name || q;
        var nameEl = el('fName');
        if (nameEl && !nameEl.value.trim()) {
          var nm = String(r.name || (r.display_name || '').split(',')[0] || '').trim();
          if (nm) nameEl.value = nm;
        }
        box.innerHTML = '<div class="none">위치를 정했어요: ' + esc((r.display_name || '').slice(0, 60)) + '</div>';
        if (map && mapReady) map.setView([lat, lng], 16);
      });
    });
  }).catch(function () {
    box.innerHTML = '<div class="none">검색을 못 했어요(인터넷 확인) — 지도에서 직접 찍어 주세요</div>';
  });
}

function download(blobOrBytes, name, type) {
  var blob = blobOrBytes instanceof Blob ? blobOrBytes : new Blob([blobOrBytes], { type: type || 'application/octet-stream' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1200);
}
function stamp() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function exportXlsx() {

function pickRestoreFile() {
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/json,.json';
  inp.style.position = 'fixed';
  inp.style.left = '-9999px';
  document.body.appendChild(inp);
  inp.addEventListener('change', function () {
    var f = inp.files && inp.files[0];
    if (!f) { document.body.removeChild(inp); return; }
    var fr = new FileReader();
    fr.onload = function () {
      document.body.removeChild(inp);
      var data = null;
      try { data = JSON.parse(String(fr.result || '')); } catch (e) { data = null; }
      if (!data) { toast('백업 파일을 읽지 못했어요'); return; }
      var list = (Array.isArray(data) ? data : (data.places || [])).map(normPlace).filter(Boolean);
      if (!list.length) { toast('백업에 장소가 없어요'); return; }
      openRestore(list, data && data.origin);
    };
    fr.readAsText(f);
  });
  inp.click();
}

/* ---------------- 남편 연동 (Firebase Realtime Database · REST + SSE) ---------------- */
var DB_URL = 'https://scmj-7f5e5-default-rtdb.asia-southeast1.firebasedatabase.app';
var INVITE_BASE = 'https://minjeong9393.github.io/place-log/';
var sync = { room: '', key: '', status: 'off', stream: 'idle', es: null, timer: null, retry: 0, pending: 0, error: '' };
var applyingRemote = false;

function utf8Hex(s) {
  var enc = '';
  try { enc = encodeURIComponent(String(s)); } catch (e) { return ''; }
  var out = '', i = 0;
  while (i < enc.length) {
    var ch = enc.charAt(i);
    if (ch === '%') { out += enc.substr(i + 1, 2).toLowerCase(); i += 3; }
    else { out += ('0' + enc.charCodeAt(i).toString(16)).slice(-2); i += 1; }
  }
  return out;
}
function utf8FromHex(h) {
  var s = '';
  for (var i = 0; i < h.length; i += 2) s += '%' + h.substr(i, 2);
  try { return decodeURIComponent(s); } catch (e) { return h; }
}
function encodeRoomKey(raw) {
  var code = String(raw == null ? '' : raw).trim();
  if (!code) return '';
  if (/^[A-Za-z0-9_-]{1,64}$/.test(code)) return code.toLowerCase();
  return 'u-' + utf8Hex(code).slice(0, 360);
}
function decodeRoomKey(key) {
  var k = String(key || '');
  return k.indexOf('u-') === 0 ? utf8FromHex(k.slice(2)) : k;
}
function randCode(n) {
  var chars = 'abcdefghjkmnpqrstuvwxyz23456789';
  var buf = null;
  try { if (window.crypto && window.crypto.getRandomValues) { buf = new Uint32Array(n); window.crypto.getRandomValues(buf); } } catch (e) { buf = null; }
  var out = '';
  for (var i = 0; i < n; i++) out += chars.charAt((buf ? buf[i] : Math.floor(Math.random() * 4294967296)) % chars.length);
  return out;
}
function displayRoom() { return sync.room || (sync.key ? decodeRoomKey(sync.key) : ''); }
function syncStatusText() {
  if (!sync.key) return '혼자';
  if (sync.pending > 0) return '동기화 중';
  if (sync.error) return '연결 끊김';
  if (sync.stream === 'open') return '연결됨';
  return '연결 중';
}
function computeStatus() {
  if (!sync.key) return 'off';
  if (sync.pending > 0) return 'sync';
  if (sync.error) return 'offline';
  if (sync.stream === 'open') return 'live';
  if (sync.stream === 'down') return 'offline';
  return 'connecting';
}
function refreshSyncStatus() {
  sync.status = computeStatus();
  var pill = el('syncpill');
  if (pill) {
    pill.setAttribute('data-status', sync.status);
    pill.setAttribute('aria-label', '남편 연동 — ' + syncStatusText());
    var lb = pill.querySelector('.lbl2');
    if (lb) lb.textContent = sync.key ? syncStatusText() : '혼자';
  }
  var st = el('syncState');
  if (st) {
    st.setAttribute('data-status', sync.status);
    var b = st.querySelector('b');
    if (b) b.textContent = syncStatusText();
  }
}
function inviteLink() {
  var base = INVITE_BASE;
  try {
    if ((window.location.protocol === 'http:' || window.location.protocol === 'https:') && window.location.origin) {
      base = window.location.origin + window.location.pathname;
    }
  } catch (e) { }
  if (base.charAt(base.length - 1) !== '/') base += '/';
  return base + '#room=' + encodeURIComponent(sync.key);
}
function dbFetch(path, opts) {
  if (typeof window.fetch !== 'function') return Promise.reject(new Error('no fetch'));
  return window.fetch(DB_URL + path, opts).then(function (res) {
    if (!res || res.ok === false) {
      var err = new Error('HTTP ' + (res && res.status ? res.status : '?'));
      err.status = res && res.status ? res.status : 0;
      throw err;
    }
    return res.text();
  }).then(function (txt) {
    if (!txt) return null;
    try { return JSON.parse(txt); } catch (e) { return null; }
  });
}
function dbGet(path) { return dbFetch(path, { method: 'GET', cache: 'no-store' }); }
function dbPut(path, value) {
  return dbFetch(path, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(value) });
}
function dbDel(path) { return dbFetch(path, { method: 'DELETE' }); }

function syncPlaceOf(p) {
  return {
    id: p.id, name: p.name, cat: p.cat, status: p.status, lat: p.lat, lng: p.lng,
    addr: p.addr, menu: p.menu, memo: p.memo, review: p.review, rating: p.rating,
    visitedAt: p.visitedAt, createdAt: p.createdAt, updatedAt: p.updatedAt
  };
}
function remotePlaces(raw) {
  var out = [];
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
  Object.keys(raw).forEach(function (k) {
    var p = normPlace(raw[k]);
    if (p) { if (!raw[k].id) p.id = String(k); out.push(p); }
  });
  return out;
}
function withPending(fn) {
  sync.pending++;
  refreshSyncStatus();
  var p;
  try { p = fn(); } catch (e) { p = Promise.reject(e); }
  return Promise.resolve(p).then(function (v) {
    sync.pending = Math.max(0, sync.pending - 1);
    refreshSyncStatus();
    return v;
  }, function (e) {
    sync.pending = Math.max(0, sync.pending - 1);
    refreshSyncStatus();
    throw e;
  });
}
function busyTyping() {
  var a = document.activeElement;
  if (!a || !a.tagName) return false;
  var tag = String(a.tagName).toLowerCase();
  if (tag !== 'input' && tag !== 'textarea') return false;
  return !!(a.closest && a.closest('.sheet'));
}
function safeRender() { if (!busyTyping()) render(); }
function syncFail(err) {
  sync.error = (err && err.status) ? ('HTTP ' + err.status) : String((err && err.message) || 'error');
  sync.stream = sync.stream === 'open' ? 'open' : 'down';
  refreshSyncStatus();
  if (sync.key) scheduleReconnect(sync.key);
}
function syncPushPlace(p) {
  if (!sync.key || applyingRemote || !p) return Promise.resolve(false);
  var key = sync.key, id = String(p.id);
  var hadTomb = state.removed[id];
  if (hadTomb) delete state.removed[id];
  var body = syncPlaceOf(p);
  return withPending(function () {
    return dbPut('/rooms/' + key + '/places/' + id + '.json', body).then(function () {
      if (hadTomb) return dbDel('/rooms/' + key + '/removed/' + id + '.json');
      return null;
    }).then(function () { return dbPut('/rooms/' + key + '/updatedAt.json', Date.now()); });
  }).then(function () {
    sync.error = '';
    refreshSyncStatus();
    return true;
  }, function (err) { syncFail(err); return false; });
}
function syncDelPlace(id) {
  if (!sync.key || applyingRemote) return Promise.resolve(false);
  var key = sync.key;
  var ts = state.removed[id] || Date.now();
  return withPending(function () {
    return dbDel('/rooms/' + key + '/places/' + id + '.json').then(function () {
      return dbPut('/rooms/' + key + '/removed/' + id + '.json', ts);
    }).then(function () { return dbPut('/rooms/' + key + '/updatedAt.json', Date.now()); });
  }).then(function () {
    sync.error = '';
    refreshSyncStatus();
    return true;
  }, function (err) { syncFail(err); return false; });
}
function syncPushAll() {
  if (!sync.key || applyingRemote) return Promise.resolve(false);
  var key = sync.key;
  var mp = {};
  state.places.forEach(function (p) { mp[p.id] = syncPlaceOf(p); });
  var removed = state.removed || {};
  var hasRemoved = Object.keys(removed).length > 0;
  return withPending(function () {
    var p = state.places.length ? dbPut('/rooms/' + key + '/places.json', mp) : dbDel('/rooms/' + key + '/places.json');
    return p.then(function () {
      return hasRemoved ? dbPut('/rooms/' + key + '/removed.json', removed) : dbDel('/rooms/' + key + '/removed.json');
    }).then(function () { return dbPut('/rooms/' + key + '/updatedAt.json', Date.now()); });
  }).then(function () {
    sync.error = '';
    refreshSyncStatus();
    return true;
  }, function (err) { syncFail(err); return false; });
}
function mergePlaces(local, remote, removed) {
  var rmap = {};
  var tombstones = removed || {};
  remote.forEach(function (p) { rmap[p.id] = p; });
  var push = [];
  local.forEach(function (l) {
    var tomb = tombstones[l.id];
    if (tomb && tomb >= (l.updatedAt || 0)) return;
    var rr = rmap[l.id];
    if (!rr) { rmap[l.id] = l; push.push(l); return; }
    if ((l.updatedAt || 0) > (rr.updatedAt || 0)) { rmap[l.id] = l; push.push(l); }
  });
  var out = [];
  Object.keys(rmap).forEach(function (id) {
    var p = rmap[id];
    var tomb = tombstones[id];
    if (tomb && tomb >= (p.updatedAt || 0)) return;
    out.push(p);
  });
  return { places: out, push: push };
}
function syncCloseStream() {
  if (sync.es) { try { sync.es.close(); } catch (e) { } sync.es = null; }
  sync.stream = 'idle';
}
function scheduleReconnect(key) {
  if (sync.timer || !sync.key || key !== sync.key) return;
  sync.retry = Math.min(sync.retry + 1, 6);
  var wait = Math.min(30000, 1200 * Math.pow(2, sync.retry - 1));
  sync.timer = setTimeout(function () {
    sync.timer = null;
    if (key !== sync.key) return;
    syncPull({ quiet: true });
  }, wait);
}
function applyStreamEvent(ev) {
  var msg = null;
  try { msg = JSON.parse(ev && ev.data); } catch (e) { return; }
  if (!msg || typeof msg !== 'object') return;
  var path = String(msg.path || '/').replace(/^\/+/, '');
  var data = msg.data;
  var before = JSON.stringify([state.places, state.removed]);
  applyingRemote = true;
  try {
    if (!path) {
      var room = (data && typeof data === 'object') ? data : {};
      state.places = remotePlaces(room.places);
      state.removed = normRemoved(room.removed);
    } else if (path === 'updatedAt') {
      return;
    } else if (path.indexOf('places/') === 0) {
      var id = path.slice(7).split('/')[0];
      if (!id) return;
      state.places = state.places.filter(function (p) { return p.id !== id; });
      var p = data ? normPlace(data) : null;
      if (p) { if (!data.id) p.id = id; state.places.push(p); }
    } else if (path.indexOf('removed/') === 0) {
      var rid = path.slice(8).split('/')[0];
      if (!rid) return;
      var ts = Number(data) || Date.now();
      state.removed[rid] = Math.max(ts, state.removed[rid] || 0);
      state.places = state.places.filter(function (p) { return !(p.id === rid && (p.updatedAt || 0) <= ts); });
    } else {
      return;
    }
    if (JSON.stringify([state.places, state.removed]) !== before) {
      persist();
      safeRender();
    }
  } finally {
    applyingRemote = false;
  }
}
function syncStartStream() {
  syncCloseStream();
  if (!sync.key || typeof window.EventSource !== 'function') { refreshSyncStatus(); return; }
  var key = sync.key;
  var es = null;
  try { es = new window.EventSource(DB_URL + '/rooms/' + key + '.json'); }
  catch (e) { sync.stream = 'down'; refreshSyncStatus(); scheduleReconnect(key); return; }
  sync.es = es;
  es.onopen = function () {
    if (key !== sync.key) return;
    sync.retry = 0; sync.stream = 'open'; sync.error = '';
    refreshSyncStatus();
  };
  es.onerror = function () {
    if (key !== sync.key) return;
    sync.stream = 'down';
    refreshSyncStatus();
    syncCloseStream();
    scheduleReconnect(key);
  };
  var onEvent = function (ev) { if (key === sync.key) applyStreamEvent(ev); };
  try {
    es.addEventListener('put', onEvent);
    es.addEventListener('patch', onEvent);
  } catch (e) { }
}
function syncPull(opts) {
  opts = opts || {};
  if (!sync.key) return Promise.resolve(false);
  var key = sync.key;
  return withPending(function () {
    return dbGet('/rooms/' + key + '.json').then(function (raw) {
      if (key !== sync.key) return false;
      sync.error = '';
      var room = (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};
      var remote = remotePlaces(room.places);
      var removed = normRemoved(room.removed);
      if (!remote.length && !Object.keys(removed).length) {
        if (state.places.length && (opts.join || !opts.quiet)) {
          return syncPushAll().then(function () { syncStartStream(); return true; });
        }
        syncStartStream();
        return false;
      }
      var merged = mergePlaces(state.places, remote, removed);
      state.places = merged.places;
      Object.keys(removed).forEach(function (id) {
        state.removed[id] = Math.max(removed[id], state.removed[id] || 0);
      });
      persist();
      safeRender();
      if (merged.push.length) {
        return withPending(function () {
          return Promise.all(merged.push.map(function (p) {
            return dbPut('/rooms/' + key + '/places/' + p.id + '.json', syncPlaceOf(p));
          })).then(function () { return dbPut('/rooms/' + key + '/updatedAt.json', Date.now()); });
        }).then(function () { syncStartStream(); return true; });
      }
      syncStartStream();
      return true;
    });
  }).then(function (v) { refreshSyncStatus(); return v; }, function (err) {
    syncFail(err);
    return false;
  });
}
function setRoom(raw) {
  var code = String(raw == null ? '' : raw).trim();
  var key = encodeRoomKey(code);
  sync.room = code;
  sync.key = key;
  lsSet(KEY_ROOM, code);
  refreshSyncStatus();
  return key;
}
function syncDisconnect() {
  if (sync.timer) { clearTimeout(sync.timer); sync.timer = null; }
  syncCloseStream();
  sync.retry = 0; sync.room = ''; sync.key = ''; sync.error = '';
  lsSet(KEY_ROOM, '');
  refreshSyncStatus();
}
function syncConnect() {
  if (!sync.key) { refreshSyncStatus(); return; }
  sync.retry = 0;
  syncPull({ join: true });
}
function roomFromHash() {
  var h = '';
  try { h = String(window.location.hash || ''); } catch (e) { return ''; }
  if (h.indexOf('#room=') !== 0) return '';
  var v = h.slice(6);
  try { v = decodeURIComponent(v); } catch (e) { }
  return String(v || '').trim();
}
function stripHash() {
  try { window.history.replaceState(null, '', window.location.pathname + window.location.search); }
  catch (e) { try { window.location.hash = ''; } catch (e2) { } }
}
function bootSync() {
  var fromHash = roomFromHash();
  if (fromHash) {
    setRoom(fromHash);
    stripHash();
    syncConnect();
    toast('남편 방에 연결했어요');
    return;
  }
  var saved = lsGet(KEY_ROOM);
  if (saved) {
    setRoom(saved);
    syncPull({ quiet: true });
  }
}
function openSync() {
  var on = !!sync.key;
  var body = '<div class="syncstate" id="syncState" data-status="' + computeStatus() + '"><span class="d"></span><b>' + syncStatusText() + '</b></div>' +
    '<p class="hint">방 코드를 아는 기기끼리 같은 가볼곳 목록을 실시간으로 봐요. 연동을 풀어도 기록은 이 기기에 그대로 남아요.</p>' +
    (on
      ? '<div class="flabel">방 코드</div><div class="roombox"><span class="sp">' + esc(displayRoom()) + '</span></div>' +
        '<p class="hint" style="margin-top:8px">남편은 아래 초대 링크를 누르면 바로 연결돼요.</p>' +
        '<div class="linksrow"><button type="button" class="btn" id="syncCopy">초대 링크 복사</button>' +
        '<button type="button" class="btn" id="syncPullBtn">새로 고침</button>' +
        '<button type="button" class="btn danger" id="syncOff">연동 해제</button></div>'
      : '<div class="linksrow"><button type="button" class="btn primary" id="syncNew">새 방 만들기</button></div>' +
        '<div class="flabel">방 코드로 참여</div>' +
        '<div class="searchrow2"><input class="field" id="syncCode" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="예: place-xxxxxx">' +
        '<button type="button" class="btn" id="syncJoin">참여</button></div>');
  openSheet('남편 연동', body, '<span class="grow"></span><button type="button" class="btn primary" data-close="1">닫기</button>');
  refreshSyncStatus();
  var nb = el('syncNew');
  if (nb) nb.addEventListener('click', function () {
    var code = 'place-' + randCode(6);
    setRoom(code);
    syncPushAll().then(function () { syncStartStream(); });
    openSync();
    toast('방을 만들었어요 — 초대 링크를 남편에게 보내세요');
  });
  var jb = el('syncJoin');
  if (jb) jb.addEventListener('click', function () {
    var code = (el('syncCode') && el('syncCode').value || '').trim();
    if (!code) { toast('방 코드를 넣어 주세요'); return; }
    setRoom(code);
    syncConnect();
    openSync();
    toast('방에 연결했어요');
  });
  var cb = el('syncCopy');
  if (cb) cb.addEventListener('click', function () {
    var link = inviteLink();
    var done = function () { toast('초대 링크를 복사했어요'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(done, function () { prompt('아래 링크를 복사해 주세요', link); });
    } else prompt('아래 링크를 복사해 주세요', link);
  });
  var pb = el('syncPullBtn');
  if (pb) pb.addEventListener('click', function () { syncPull({ join: true }); toast('새로 고치는 중…'); });
  var ob = el('syncOff');
  if (ob) ob.addEventListener('click', function () {
    if (!confirm('남편 연동을 해제할까요? 이 기기 기록은 그대로 남아요.')) return;
    syncDisconnect();
    openSync();
    toast('연동을 해제했어요');
  });
}

/* ---------------- 렌더 묶음 ---------------- */
function render() {
  renderHeader();
  renderFilters();
  renderList();
  renderMarkers();
}

/* ---------------- 이벤트 배선 ---------------- */
function setStatus(st) { prefs.status = st; savePrefs(); render(); }
function setCat(c) { prefs.cat = c; savePrefs(); render(); }
function wire() {
  el('q').addEventListener('input', function () {
    el('searchbox').classList.toggle('has', !!this.value);
    renderList();
    renderMarkers();
  });
  el('qClr').addEventListener('click', function () {
    el('q').value = '';
    el('searchbox').classList.remove('has');
    el('q').focus();
    renderList(); renderMarkers();
  });
  el('statusTabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-status]');
    if (b) setStatus(b.getAttribute('data-status'));
  });
  el('catbar').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-cat]');
    if (b) setCat(b.getAttribute('data-cat'));
  });
  el('sortSel').addEventListener('change', function () { prefs.sort = this.value; savePrefs(); renderList(); renderMarkers(); });
  el('btnMenu').addEventListener('click', openMenu);
  el('btnAddTop').addEventListener('click', function () { openForm(null); });
  el('fab').addEventListener('click', function () { openForm(null); });
  el('syncpill').addEventListener('click', openSync);
  el('btnLocate').addEventListener('click', function () { locate(false); });
  el('btnBase').addEventListener('click', function () { startPick('base'); });
  el('btnPickCancel').addEventListener('click', function () { endPick(); });
  document.querySelectorAll('.tabbar button').forEach(function (b) {
    b.addEventListener('click', function () { setView(b.getAttribute('data-view')); });
  });
  el('listHead').addEventListener('click', function (e) {
    if (e.target.closest('#btnLocate2')) locate(false);
  });

  // 목록 카드 · 지도 버튼 · 빈 화면
  el('list').addEventListener('click', function (e) {
    var ml = e.target.closest('[data-map]');
    if (ml) { e.stopPropagation(); showOnMap(ml.getAttribute('data-map')); return; }
    var act = e.target.closest('[data-act]');
    if (act) {
      var a = act.getAttribute('data-act');
      if (a === 'add') openForm(null);
      if (a === 'clearFilter') { prefs.status = 'all'; prefs.cat = 'all'; el('q').value = ''; savePrefs(); render(); }
      return;
    }
    var card = e.target.closest('.pcard');
    if (card) {
      var p = byId(card.getAttribute('data-id'));
      if (p) { ui.sel = p.id; highlightSel(); openForm(p); }
    }
  });
  el('list').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var card = e.target.closest('.pcard');
    if (!card) return;
    e.preventDefault();
    var p = byId(card.getAttribute('data-id'));
    if (p) { ui.sel = p.id; highlightSel(); openForm(p); }
  });

  // 시트: 바깥 클릭·닫기 버튼·ESC
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    if (t.closest('[data-overlay]')) { closeSheet(); return; }
    if (t.closest('[data-close]')) { e.preventDefault(); closeSheet(); return; }
    var detail = t.closest('[data-act="detail"]');
    if (detail) { var p = byId(detail.getAttribute('data-id')); if (p) openForm(p); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (ui.pick) { endPick(); return; }
      if (el('sheetroot').innerHTML) closeSheet();
    }
  });

  window.addEventListener('focus', function () {
    if (sync.key && sync.status !== 'sync') syncPull({ quiet: true });
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && sync.key && sync.status !== 'sync') syncPull({ quiet: true });
    if (document.hidden) return;
  });
}

/* ---------------- PWA ---------------- */
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { });
  });
}

/* ---------------- 부팅 ---------------- */
function boot() {
  loadPrefs();
  loadOrigin();
  loadState();
  el('view').setAttribute('data-view', prefs.view);
  document.querySelectorAll('.tabbar button').forEach(function (b) {
    b.setAttribute('aria-selected', b.getAttribute('data-view') === prefs.view);
  });
  wire();
  initMap();
  render();
  if (prefs.view === 'map') setView('map');
  // PC(두 단이 함께 보이는 화면)에서는 처음부터 담아 둔 곳이 모두 보이게
  if (window.innerWidth >= 900) window.setTimeout(function () { fitToPlaces(); }, 240);
  bootSync();
  registerSW();
  if (!state.places.length) { /* 빈 상태 안내만 */ }
  // 이미 위치 권한이 허용된 기기라면 조용히 내 위치로 거리 기준을 잡는다
  try {
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'geolocation' }).then(function (st) {
        if (st && st.state === 'granted') locate(true);
      }).catch(function () { });
    }
  } catch (e) { }
  window.__PLACE_LOG = { state: state, prefs: prefs, origin: origin, distM: distM, filtered: filtered, getMap: function () { return map; }, version: APP_VER };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
